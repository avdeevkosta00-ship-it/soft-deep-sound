name: Build Windows and macOS apps
on:
  push:
    branches: [main]
    tags: ['v*']          # тег вида v1.9.0 = выпуск релиза
  workflow_dispatch:      # кнопка «Run workflow» во вкладке Actions
permissions:
  contents: write         # нужно, чтобы прикрепить .exe к релизу
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: SoftDeepSound-Windows
          path: dist/*.exe
      # только для тегов v*: создать релиз на GitHub и приложить к нему установщик и portable-версию
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # latest.yml + .blockmap: what the installed app reads to update itself
          files: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          generate_release_notes: true
  # macOS: built on Apple's runner after the Windows job (so both add their files to the same release)
  mac:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: SoftDeepSound-macOS
          path: dist/*.dmg
      # latest-mac.yml + .zip: what the installed app reads to hear about a new version
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
