name: Build Windows app
on:
  push:
    branches: [main]
    tags: ['v*']          # тег вида v1.9.0 = выпуск релиза
  workflow_dispatch:      # кнопка «Run workflow» во вкладке Actions
permissions:
  contents: write         # нужно, чтобы прикрепить .exe к релизу
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: SoftDeepSound-Windows
          path: dist/*.exe
      # только для тегов v*: создать релиз на GitHub и приложить к нему установщик и portable-версию
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
